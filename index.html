<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificación LoL</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .6rem; text-align: left; border-bottom: 1px solid #ddd; }
  small { color: #777; }
</style>
</head>
<body>
<h1>Clasificación Solo/Duo</h1>
<table>
  <thead><tr><th>#</th><th>Cuenta</th><th>Rango</th><th>LP</th><th>Partidas</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<small id="updated"></small>
<script>
fetch("data.json?t=" + Date.now()).then(r => r.json()).then(d => {
  document.getElementById("rows").innerHTML = d.players.map((p, i) =>
    `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.tier} ${p.rank}</td><td>${p.lp}</td><td>${p.games}</td></tr>`
  ).join("");
  document.getElementById("updated").textContent =
    "Última actualización: " + new Date(d.updated).toLocaleString("es-ES");
});
</script>
</body>
</html>
